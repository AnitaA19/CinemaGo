name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Check registry configuration
        run: |
          : "${ACR_NAME:?Set the ACR_NAME repository variable}"
          : "${ACR_LOGIN_SERVER:?Set the ACR_LOGIN_SERVER repository variable}"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --file CinemaGo.Web/Dockerfile --tag "$ACR_LOGIN_SERVER/cinemago:$GITHUB_SHA" .

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to registry and push image
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$ACR_LOGIN_SERVER/cinemago:$GITHUB_SHA"
